name: MythosHandy
options:
  bundleIdPrefix: com.mythoscraft
targets:
  MythosHandy:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources: [Sources]
    resources: [Resources]
    info:
      path: Generated-Info.plist
      properties:
        CFBundleDisplayName: Mythos
        CFBundleShortVersionString: "__APP_VERSION__"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
        UIRequiresFullScreen: true
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mythoscraft.mythos
        PRODUCT_NAME: Mythos
        MARKETING_VERSION: "__APP_VERSION__"
        CURRENT_PROJECT_VERSION: "1"
        IPHONEOS_DEPLOYMENT_TARGET: "16.0"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Manual
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGN_IDENTITY: ""
        DEVELOPMENT_TEAM: ""
