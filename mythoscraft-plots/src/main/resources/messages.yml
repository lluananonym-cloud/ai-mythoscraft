help: "<newline><gradient:#5ef0a0:#22d3ee><bold>Plot commands</bold></gradient><newline><green>/plot auto</green> <gray>– claim the next free plot<newline><green>/plot claim</green> <gray>– claim the plot you stand on<newline><green>/plot home [n]</green> <gray>– to your plot<newline><green>/plot list</green> <gray>– your plots<newline><green>/plot visit <player> [n]</green> <gray>– visit a plot<newline><green>/plot info</green> <gray>– who owns this plot<newline><green>/plot add|remove <player></green> <gray>– let friends build<newline><green>/plot deny|undeny <player></green> <gray>– keep someone out<newline><green>/plot border</green> <gray>– pick the border colour of your plot<newline><green>/plot clear confirm</green> <gray>– reset your plot<newline><green>/plot unclaim confirm</green> <gray>– give the plot up<newline><gold>/smp</gold> <gray>– back to the main server<newline>"
