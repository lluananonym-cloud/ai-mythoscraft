# MythosPlots – plot server of MythosCraft
# Switching servers works through MineKeep's proxy: /smp asks the proxy to connect the player ("Connect"),
# and if that does not happen within 2 s, a button sends /mk join <server> from the player's game.

# do not change – lets the plugin update older settings
config-version: 2

main-server:
  # server name at MineKeep
  proxy-server: mythoscraftsmp
  join-command: "mk join mythoscraftsmp"
  # website of the main server (MythosCraft plugin): inventory sync, rank, coins, gems, plots per rank
  api-url: "https://mythoscraftsmp.minekeep.dev:2083"
  # more addresses to try if the one above does not answer (e.g. "http://<ip>:2083")
  api-fallbacks: []

# Same inventory, ender chest, XP, health and hunger as on the survival server.
# key: run /mythos synckey on the survival server, click to copy, paste it in the chat here (as OP).
sync:
  enabled: true
  key: ""

scoreboard:
  enabled: true
  title: "<gradient:#c084fc:#f59e0b><bold>✦ MythosCraft ✦</bold></gradient>"
  footer: "<gradient:#c084fc:#f59e0b>mythoscraft.online</gradient>"

world:
  # created automatically with its own generator (plot raster) – no flat world or build command needed
  name: plots
  # SURVIVAL (same inventory as on the survival server) or CREATIVE
  gamemode: SURVIVAL
  # only admins & co. can switch to another game mode here (/gm c|s|sp|a) – OP, permission mythosplots.gamemode
  # or one of these MythosCraft ranks. Creative has its own empty inventory (creative items never reach MythosCraft).
  force-gamemode: true
  gamemode-ranks: [BUILDER, ADMIN, OWNER, MYTHOS]
  always-day: true
  no-weather: true
  pvp: false
  item-drops: true
  # true = every join starts at the spawn, false = players stay where they left
  spawn-on-join: false

plots:
  # plot size in blocks and road width – do NOT change once plots are claimed
  size: 48
  road: 7
  # plots per player; more by MythosCraft rank (main plugin: rank-perks.<rank>.plots)
  # or with permission mythosplots.plots.<n> (e.g. mythosplots.plots.3) – the highest counts
  max-per-player: 1
  road-block: POLISHED_ANDESITE
  road-edge-block: STONE_BRICKS
  border-free: SMOOTH_STONE_SLAB
  border-claimed: QUARTZ_SLAB
  reset-columns-per-tick: 12

resource-pack:
  enabled: true
  required: true
  # external link instead of the built-in web server (then also set sha1)
  url: ""
  sha1: ""
  self-host:
    bind: 0.0.0.0
    # MineKeep allows only the ports 2053, 2083, 2087 and 2096
    port: 2053
    public-url: "https://mythoscraftsmpplot.minekeep.dev:2053"

chat:
  format: true
