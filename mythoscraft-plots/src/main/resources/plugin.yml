name: MythosPlots
version: '${project.version}'
main: online.mythoscraft.plots.MythosPlots
api-version: '1.21'
# on the survival server: MythosCraft first, so it keeps /plot, /mythos, /money … and hands /plot over to this plugin
softdepend: [MythosCraft]
author: MinePro641
website: https://mythoscraft.online
description: MythosCraft plot server – plot world, /plot, protection, same resource pack, /smp back to the main server.
commands:
  plot:
    description: Claim and manage your plot (/plot help)
    usage: /plot help
    aliases: [p, plots]
  gm:
    description: Change game mode (admins & co.)
    usage: /gm <c|s|sp|a> [player]
    aliases: [gmc, gms, gmsp, gma]
  balance:
    description: Your coins and gems (from the survival server)
    usage: /money
    aliases: [money, coins, gems, bal]
  smp:
    description: Back to the MythosCraft main server
    usage: /smp
    aliases: [mythos, hub, lobby, survival]
permissions:
  mythosplots.gamemode:
    description: May use /gm and change the game mode on the plot server
    default: op
  mythosplots.admin:
    description: Build everywhere, unlimited plots, /plot admin
    default: op
