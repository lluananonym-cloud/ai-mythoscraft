name: Build Desktop Apps

# Baut die Windows-Installer der Mythos-Programme automatisch und legt sie als
# Release in diesem (öffentlichen) Repo ab. Die Website (/downloads) verlinkt
# direkt auf diese Releases, es muss also nichts mehr von Hand gebaut werden.
#
# Läuft alle 3 Stunden und baut nur, wenn sich im Quell-Repo etwas geändert hat.
# Sofort bauen: Actions > "Build Desktop Apps" > "Run workflow".

on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Auch ohne Änderungen neu bauen'
        type: boolean
        default: false
  repository_dispatch:
    types: [build-apps]
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-apps.yml'

permissions:
  contents: write

concurrency:
  group: build-apps-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: code
            name: Mythos Code
            repo: lluananonym-cloud/mythos-code
            private: false
            tag: code-latest
            asset: MythosCode-Setup.exe
            build: npm run dist
          - id: browser
            name: Mythos Browser
            repo: lluananonym-cloud/mythos-browser
            private: true
            tag: browser-latest
            asset: MythosBrowser-Setup.exe
            build: npx electron-builder --win nsis --x64 --publish never
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ matrix.tag }}
      ASSET: ${{ matrix.asset }}
    steps:
      # Private Quell-Repos brauchen einen Token mit Lesezugriff (Secret APPS_REPO_TOKEN).
      - name: Zugriff prüfen
        id: access
        env:
          HAS_TOKEN: ${{ secrets.APPS_REPO_TOKEN != '' }}
        run: |
          if [ "${{ matrix.private }}" = "true" ] && [ "$HAS_TOKEN" != "true" ]; then
            echo "::warning::${{ matrix.name }} übersprungen: Secret APPS_REPO_TOKEN fehlt (privates Repo ${{ matrix.repo }})."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Quellcode holen
        if: steps.access.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ matrix.repo }}
          token: ${{ matrix.private && secrets.APPS_REPO_TOKEN || github.token }}
          path: app

      - name: Prüfen, ob ein neuer Build nötig ist
        if: steps.access.outputs.skip != 'true'
        id: check
        run: |
          SHA=$(git -C app rev-parse HEAD)
          VER=$(node -p "require('./app/package.json').version")
          BODY=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body -q .body 2>/dev/null || true)
          OLD_SHA=$(printf '%s' "$BODY" | sed -n 's/.*source-sha: \([0-9a-f]*\).*/\1/p' | head -1)
          OLD_VER=$(printf '%s' "$BODY" | sed -n 's/.*version: \([0-9][0-9A-Za-z.+-]*\).*/\1/p' | head -1)
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "Quelle: $VER ($SHA) · veröffentlicht: ${OLD_VER:-keine} (${OLD_SHA:-keine})"
          if [ "$SHA" = "$OLD_SHA" ] && [ "${{ inputs.force }}" != "true" ]; then
            echo "Keine Änderungen, nichts zu tun."
            echo "build=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # Nie eine ältere Version über eine neuere legen (z. B. wenn ein Installer von Hand hochgeladen wurde).
          if [ -n "$OLD_VER" ] && node -e "
            const p = (v) => v.split(/[.+-]/).slice(0, 3).map(Number);
            const [a, b] = [p(process.argv[1]), p(process.argv[2])];
            for (let i = 0; i < 3; i++) { if (a[i] !== b[i]) process.exit(a[i] < b[i] ? 0 : 1); }
            process.exit(1);
          " "$VER" "$OLD_VER"; then
            echo "::warning::${{ matrix.name }}: Quelle hat Version $VER, veröffentlicht ist schon $OLD_VER. Version in package.json erhöhen, dann wird gebaut."
            echo "build=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "build=true" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        if: steps.check.outputs.build == 'true'
        with:
          node-version: 20

      - name: Installer bauen
        if: steps.check.outputs.build == 'true'
        working-directory: app
        run: |
          npm install --no-audit --no-fund
          ${{ matrix.build }}

      - name: Installer veröffentlichen
        if: steps.check.outputs.build == 'true'
        run: |
          EXE=$(ls app/dist/*.exe | grep -vi uninstall | head -1)
          [ -n "$EXE" ] || { echo "::error::Kein .exe in app/dist gefunden"; exit 1; }
          mkdir -p out && cp "$EXE" "out/$ASSET"
          NOTES="Automatischer Build von ${{ matrix.repo }}. Download über https://ai-mythos.lovable.app/downloads

          <!-- version: ${{ steps.check.outputs.version }} -->
          <!-- source-sha: ${{ steps.check.outputs.sha }} -->"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "${{ matrix.name }} (neueste Version)" --notes "$NOTES" --latest=false
          gh release upload "$TAG" "out/$ASSET" --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --title "${{ matrix.name }} ${{ steps.check.outputs.version }}" --notes "$NOTES"
