name: Build MythosAI Plugin

on:
  push:
    branches: [main]
    paths:
      - 'minecraft-plugin/**'
      - '.github/workflows/build-plugin.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build with Maven
        working-directory: minecraft-plugin
        run: mvn -B clean package

      - name: Upload jar as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: MythosAI-jar
          path: minecraft-plugin/target/MythosAI.jar

      - name: Publish rolling "latest" release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: plugin-latest
          name: MythosAI Plugin (latest)
          body: |
            Automatischer Build vom letzten `main` Commit.
            Datei: **MythosAI.jar** – nach `plugins/` kopieren, Server neu starten.
          files: minecraft-plugin/target/MythosAI.jar
          make_latest: 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
