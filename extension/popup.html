<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <title>Mythos AI</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0; width: 380px; height: 520px; display: flex; flex-direction: column;
        background: #0b0b12; color: #eceaf5;
        font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      header { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-bottom: 1px solid #ffffff14; }
      header img { width: 20px; height: 20px; }
      header strong { font-size: 13px; }
      header span { margin-left: auto; font-size: 10px; color: #8f8aa8; }
      #log { flex: 1; overflow-y: auto; padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; }
      .m { padding: 8px 10px; border-radius: 12px; max-width: 92%; white-space: pre-wrap; word-break: break-word; }
      .user { align-self: flex-end; background: #7c5cff26; border: 1px solid #7c5cff4d; }
      .ai { align-self: flex-start; background: #ffffff0a; border: 1px solid #ffffff12; }
      .act { align-self: flex-start; font-size: 11px; color: #9d97b8; padding-left: 4px; }
      .err { color: #ff8f8f; }
      footer { padding: 8px; border-top: 1px solid #ffffff14; display: flex; gap: 6px; }
      textarea {
        flex: 1; resize: none; height: 38px; border-radius: 10px; padding: 9px 10px;
        background: #ffffff0a; border: 1px solid #ffffff1a; color: inherit; font: inherit; outline: none;
      }
      textarea:focus { border-color: #7c5cff80; }
      button {
        border: 0; border-radius: 10px; padding: 0 12px; cursor: pointer;
        background: linear-gradient(135deg, #7c5cff, #b06bff); color: #fff; font-weight: 600;
      }
      button:disabled { opacity: .5; cursor: default; }
      .hint { padding: 0 12px 8px; font-size: 10px; color: #6f6a86; }
    </style>
  </head>
  <body>
    <header>
      <img src="icon.png" alt="Mythos AI" />
      <strong>Mythos AI · Browser Control</strong>
      <span id="status">bereit</span>
    </header>
    <div id="log">
      <div class="m ai">Hi! Sag mir, was ich in deinem Browser machen soll — z.&nbsp;B. „öffne YouTube und suche Lofi Beats" oder „fasse diese Seite zusammen".</div>
    </div>
    <div class="hint">Du siehst live, wie die Maus klickt. Bei Logins übernimmst du selbst.</div>
    <footer>
      <textarea id="in" placeholder="Anweisung…"></textarea>
      <button id="go">Los</button>
    </footer>
    <script src="popup.js"></script>
  </body>
</html>
