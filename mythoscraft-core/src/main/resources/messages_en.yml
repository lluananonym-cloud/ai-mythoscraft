  thank-broadcast: '<gray>❤ <white>{player}</white> <gray>thanked <white>{helper}</white> <gray>for helping. Help new players <green>[NEW]</green> <gray>and get coins!'
  answers:
    general: "<newline><green><bold>Lia</bold></green> <dark_gray>»</dark_gray> <white>Here is what you can do:<newline><click:run_command:'/rtp'><hover:show_text:'<gray>Click'><gold>⛏ /rtp</gold></hover></click> <gray>– find a free spot in the wild and get your own protected base<newline><click:run_command:'/plot'><hover:show_text:'<gray>Click'><green>🏠 /plot</green></hover></click> <gray>– build on your own plot in the plot world<newline><click:run_command:'/kisten'><hover:show_text:'<gray>Click'><light_purple>📦 /crates</light_purple></hover></click> <gray>– crates, keys and rare relics at spawn<newline><click:run_command:'/jobs'><hover:show_text:'<gray>Click'><yellow>💰 /jobs</yellow></hover></click> <gray>– earn coins with every block you mine, chop or farm<newline><click:run_command:'/guide'><hover:show_text:'<gray>Click'><aqua>✦ /guide</aqua></hover></click> <gray>– a glowing trail shows you everything (with a reward!)<newline>"
    money: "<newline><green><bold>Lia</bold></green> <dark_gray>»</dark_gray> <white>Coins come from <click:run_command:'/jobs'><yellow><u>/jobs</u></yellow></click> <gray>(mining, farming, fishing …), the free daily reward (<click:run_command:'/daily'><yellow><u>/daily</u></yellow></click><gray>), quests (<click:run_command:'/aufgaben'><yellow><u>/quests</u></yellow></click><gray>), events and the wheels of fortune at spawn. Sell stuff in <click:run_command:'/ah'><yellow><u>/ah</u></yellow></click><gray>.<newline>"
    home: "<newline><green><bold>Lia</bold></green> <dark_gray>»</dark_gray> <white>After your first <click:run_command:'/rtp'><gold><u>/rtp</u></gold></click> <white>you get your own <green>protected base</green> (21×21) with a starter chest. <click:run_command:'/base'><green><u>/base</u></green></click> <gray>brings you back, <white>/base here</white> <gray>moves it, <white>/sethome</white> <gray>saves more homes.<newline>"
    wild: "<newline><green><bold>Lia</bold></green> <dark_gray>»</dark_gray> <white>Type <click:run_command:'/rtp'><gold><u>/rtp</u></gold></click> <white>or walk into the <dark_purple>wilderness portal</dark_purple> at spawn – you land on a free spot to build and get your own protected base there.<newline>"
    crates: "<newline><green><bold>Lia</bold></green> <dark_gray>»</dark_gray> <white>Crates stand at spawn – hold the right <yellow>key</yellow> and right-click. Keys come from the daily reward, events, the wheels, quests and <click:run_command:'/shop'><yellow><u>/shop</u></yellow></click><white>. <click:run_command:'/kisten'><light_purple><u>/crates</u></light_purple></click> <gray>shows which crate comes when.<newline>"
    plot: "<newline><green><bold>Lia</bold></green> <dark_gray>»</dark_gray> <white>Want to build creative? <click:run_command:'/plot'><green><u>/plot</u></green></click> <white>beams you to the plot world – claim a plot there with <white>/plot auto</white>. <gray>Back with /smp.<newline>"
    rank: "<newline><green><bold>Lia</bold></green> <dark_gray>»</dark_gray> <white>MythosCraft is <green>free to play</green> – ranks can be won in crates, at events, in tournaments and with the daily streak. <click:run_command:'/rang'><yellow><u>/rank</u></yellow></click> <gray>shows all perks.<newline>"
base:
  name: '<green>your base'
  chest-name: '<green><bold>Starter Chest'
  created: "<newline><gradient:#5ef0a0:#22d3ee><bold>🏠 YOUR OWN PLACE!</bold></gradient><newline><white>This {size}×{size} area is now <green>protected</green> – only you can build here.<newline><gray>• A <white>starter chest</white> <gray>is right in front of you<newline><gray>• <click:run_command:'/base'><green><u>/base</u></green></click> <gray>brings you back any time (home \"base\")<newline><gray>• <white>/base here</white> <gray>moves it · <white>/base trust <player></white> <gray>lets friends build<newline>"
