  wheel:
    goal: 'Spin the wheel of fortune'
    bar: '<gold>✦ Step 2:</gold> <white>Right-click a <light_purple><bold>wheel of fortune</bold></light_purple> <dark_gray>({distance} m)'
    chat: "<green><bold>Lia</bold></green> <dark_gray>»</dark_gray> <white>Now to the <light_purple>wheels of fortune</light_purple>! The big wheel spins <green>once a day for free</green> – right-click spins, left-click shows the prizes."
  games:
    goal: 'Try the dropper'
    bar: '<gold>✦ Step 3:</gold> <white>Walk to the <aqua><bold>dropper</bold></aqua> <gray>and step on the pressure plate <dark_gray>({distance} m)'
    chat: "<green><bold>Lia</bold></green> <dark_gray>»</dark_gray> <white>The spawn has <aqua>mini games</aqua> with daily rewards: dropper, parkour, maze, spleef … Check out the <aqua>dropper</aqua>!"
  crates:
    goal: 'Learn about crates'
    bar: '<gold>✦ Step 4:</gold> <white>Go to the <gold><bold>crates</bold></gold> <dark_gray>({distance} m)'
    chat: "<green><bold>Lia</bold></green> <dark_gray>»</dark_gray> <white>Almost done – off to the <gold>crates</gold>!"
    explain: "<newline><gold><bold>📦 HOW CRATES WORK</bold></gold><newline><gray>• Every crate needs its <yellow>key</yellow> in your hand – <white>right-click</white> opens it.<newline><gray>• <white>Left-click</white> shows all prizes with their chances.<newline><gray>• Keys come from <aqua>events</aqua>, the <green>daily reward</green>, the <light_purple>wheels</light_purple> and the <yellow>/shop</yellow>.<newline><gray>• The pedestals <white>switch</white> their crate regularly – and very rarely a <gradient:#f59e0b:#ec4899:#8b5cf6><bold>Relic Crate</bold></gradient> appears!<newline>"
  rtp:
    goal: 'Into the wilderness'
    bar: '<gold>✦ Step 5:</gold> <white>Jump into the <dark_purple><bold>wilderness portal</bold></dark_purple> <gray>or type <yellow>/rtp</yellow> <dark_gray>({distance} m)'
    chat: "<green><bold>Lia</bold></green> <dark_gray>»</dark_gray> <white>Last step: the <dark_purple>wilderness portal</dark_purple> takes you to a free spot to build. <gray>Or: <click:run_command:/rtp><yellow><u>/rtp</u></yellow></click>"
