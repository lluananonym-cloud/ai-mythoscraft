intro:
  skip-hint: '<gray>Press <white><bold>SNEAK</bold></white> <gray>to skip the intro'
  welcome:
    title: '<gradient:#c084fc:#22d3ee><bold>MythosCraft</bold></gradient>'
    subtitle: '<green>100% free to play – no pay-to-win'
    lia: "<green><bold>Lia</bold></green> <dark_gray>»</dark_gray> <white>Hey, I'm <green>Lia</green>! On MythosCraft <green>everything can be earned by playing</green> – ranks, keys, items. Nothing is locked behind a paywall. <dark_gray>(sneak to skip)"
  crates:
    title: '<gold><bold>300+ custom 3D items</bold>'
    subtitle: '<gray>Real 3D models – no mods needed'
    lia: "<green><bold>Lia</bold></green> <dark_gray>»</dark_gray> <white>Swords, pickaxes, wands, hats and pets as <gold>real 3D models</gold> – with special abilities. They all come from these <gold>crates</gold>, and you see every chance before you open."
  relic:
    title: '<gradient:#f59e0b:#ec4899><bold>Relic crates</bold></gradient>'
    subtitle: '<gray>Appear only rarely – be there!'
    lia: "<green><bold>Lia</bold></green> <dark_gray>»</dark_gray> <white>On this pedestal a <gradient:#f59e0b:#ec4899>relic crate</gradient> appears every now and then – the whole server is told. Inside: drills, chainsaws, soul swords …"
  wheel:
    title: '<light_purple><bold>Two wheels of fortune</bold>'
    subtitle: '<gray>One free spin every day'
    lia: "<green><bold>Lia</bold></green> <dark_gray>»</dark_gray> <white>The big wheel spins <green>for free once a day</green>, the Mythos wheel has the rare relic keys."
  companions:
    title: '<aqua><bold>Pets that work for you</bold>'
    subtitle: '<gray>They farm even while you are offline'
    lia: "<green><bold>Lia</bold></green> <dark_gray>»</dark_gray> <white>Companions are not just cute: put a bee, penguin or snowman down and it <aqua>farms, fishes and chops trees for you</aqua> – also while you are offline. Upgrade them with gems!"
  leaderboards:
    title: '<aqua><bold>Tournaments & trophies</bold>'
    subtitle: '<gray>Daily, weekly, monthly'
    lia: "<green><bold>Lia</bold></green> <dark_gray>»</dark_gray> <white>Every day there is a <gold>PvP tournament</gold> – winners get a real trophy you can place in your base. The best players get a statue here!"
  games:
    title: '<green><bold>Minigames</bold>'
    subtitle: '<gray>Parkour, dropper, spleef & more'
    lia: "<green><bold>Lia</bold></green> <dark_gray>»</dark_gray> <white><green>Minigames</green> with daily rewards wait at the spawn – they pay coins and gems."
  wild:
    title: '<gradient:#5ef0a0:#22d3ee><bold>Your own place – free</bold></gradient>'
    subtitle: '<gray>Protected base + a plot world'
    lia: "<green><bold>Lia</bold></green> <dark_gray>»</dark_gray> <white>Jump into this portal: you land on a free spot and get your <green>own protected base</green> with a starter chest. Want to build creative? <green>/plot</green> takes you to the plot world."
  start:
    title: '<yellow><bold>Let''s go!</bold>'
    subtitle: '<gray>Log in daily – your streak grows'
    lia: "<green><bold>Lia</bold></green> <dark_gray>»</dark_gray> <white>Every login gives you a <gold>daily reward</gold> that grows with your streak – and on our website you can claim even more. Help new players and get coins with <green>/thank</green>!"
  finish: "<newline><green><bold>Lia</bold></green> <dark_gray>»</dark_gray> <white>This is how to start:<newline><gold>1.</gold> <click:run_command:'/starter'><yellow><u>/starter</u></yellow></click> <gray>– claim your starter kit<newline><gold>2.</gold> <click:run_command:'/rtp'><yellow><u>/rtp</u></yellow></click> <gray>– a free spot in the wild + your own protected base<newline><gold>3.</gold> <click:run_command:'/plot'><yellow><u>/plot</u></yellow></click> <gray>– build on your own plot<newline><gold>4.</gold> <gray>Follow the <gold>glowing trail</gold> – finishing it gives a <gold>free reward</gold>!<newline><gray>Questions? Just ask in chat. <dark_gray>(/intro shows it again)<newline>"
