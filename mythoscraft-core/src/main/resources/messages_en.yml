  enter: '<gray>Base of <white>{player}'
  enter-own: '<green>🏠 Your base'
  none: "<gray>You don't have a base yet – it is created after your first <click:run_command:'/rtp'><gold><u>/rtp</u></gold></click><gray>, or use <white>/base here</white><gray>."
  overworld-only: '<red>Bases only work in the overworld.'
  move-cooldown: '<red>You can move your base again in {time}.'
  overlap: '<red>Too close to another base or a protected area.'
  moved: '<green>✔ Your base ({size}×{size}) is now here.'
