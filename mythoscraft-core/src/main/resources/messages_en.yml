config-version: 23
config-reset:
  22: [intro]
  21: [items.minepro_totem.lore]
  20: [companion-farm.start-lore, attractions.wheel.hologram, attractions.wheel.spin-paid, attractions.wheel2.hologram]
prefix: '<gradient:#c084fc:#f59e0b><bold>MythosCraft</bold></gradient> <dark_gray>» '
general:
  usage: '<gray>Usage: <#e9d5ff>{usage}'
  no-permission: <red>You don't have permission for that.
  players-only: <red>This command is for players only.
  player-not-found: <red>Player <white>{player}</white> is not online.
  player-unknown: <red>Player <white>{player}</white> has never been on the server.
  not-a-number: <red>'{value}' is not a valid number.
  unknown-subcommand: '<red>Unknown command. Help: <white>{command}'
  error: <red>Something went wrong. The team has been notified in the log.
  data-loading: <gray>Your data is still loading – please try again in a moment.
  data-load-failed: <red>Your data could not be loaded. Please reconnect.
  login-data-failed: '<red>MythosCraft could not load your player data.

    <gray>Please try again in a few seconds.'
  save-failed: <red>Saving failed – please report this to the team.
  reloaded: '<green>Reloaded in {ms} ms. <gray>Config warnings: <white>{warnings}'
help:
  header: <gradient:#c084fc:#f59e0b><bold>MythosCraft</bold></gradient> <gray>v{version} – Commands
  mythos:
    help: <dark_gray>• <#e9d5ff>/mythos help <gray>– this help
    status: <dark_gray>• <#e9d5ff>/mythos status <gray>– status of all systems
    reload: <dark_gray>• <#e9d5ff>/mythos reload <gray>– reload config, texts, regions, events
    bypass: <dark_gray>• <#e9d5ff>/mythos bypass <gray>– region protection bypass on/off
    top: <dark_gray>• <#e9d5ff>/mythos top <stat> <gray>– leaderboard
    region: <dark_gray>• <#e9d5ff>/mythos region … <gray>– regions (pos1, pos2, create, set, info, …)
    arena: <dark_gray>• <#e9d5ff>/mythos arena … <gray>– arenas (create, setspawn, enable, snapshot, …)
    event: <dark_gray>• <#e9d5ff>/mythos event … <gray>– events (list, start, stop, info, spawnboss)
    eco: <dark_gray>• <#e9d5ff>/mythos eco <give|take|set> <player> <coins|gems> <amount>
    crate: <dark_gray>• <#e9d5ff>/mythos crate … <gray>– crates (place, remove, key, keyall, list)
    item: <dark_gray>• <#e9d5ff>/mythos item give <player> <item|set> [amount] <gray>– custom items, e.g. pumpkin_set
    boost: <dark_gray>• <#e9d5ff>/mythos boost <coins|gems|events> <factor> <duration>
    holo: <dark_gray>• <#e9d5ff>/mythos holo create <name> <stat> <gray>– hologram leaderboard
    tournament: <dark_gray>• <#e9d5ff>/mythos tournament start|test|stop|setarena|info <gray>– tournaments (test = with bots)
  player-commands: '<gray>Players: <#e9d5ff>/spawn /home /sethome /homes /tpa /balance /pay /daily /stats /top /event /arena /tournament /shop /ah /auftrag /helpop'
  region: <gray>/mythos region <#e9d5ff>wand | pos1 | pos2 | create <name> [prio] | delete <name> | info [name] | list | set [region] <flag> <true|false|none> | priority <name> <number> | redefine <name> | flags | reload
  arena: <gray>/mythos arena <#e9d5ff>place <daily|weekly|monthly> [name] | pos1 | pos2 | create <name> | delete | info | list | setspawn | clearspawns | setspectator | enable | disable | set <arena> <option> <value> | redefine | snapshot | reset
  crate: <gray>/mythos crate <#e9d5ff>place <crate> | remove | list | types | key <player> <crate> [amount] | keyall <crate> [amount]
status:
  header: <gradient:#c084fc:#f59e0b><bold>System status</bold></gradient>
  ok: <green>OK
  error: <red>ERROR
  body:
  - '<gray>Plugin: <white>{version}</white> <dark_gray>|</dark_gray> Server: <white>{server}</white> <dark_gray>|</dark_gray> TPS: <white>{tps}'
  - '<gray>Datenbank: <white>{database}</white> {db_state} <dark_gray>|</dark_gray> Warteschlange: <white>{db_pending}</white> <dark_gray>|</dark_gray> Fehler: <white>{db_failures}'
  - '<gray>Regionen: <white>{regions}</white> <dark_gray>|</dark_gray> Arenen: <white>{arenas}</white> <dark_gray>|</dark_gray> Kisten: <white>{crates}</white> <dark_gray>|</dark_gray> Hologramme: <white>{holograms}'
  - '<gray>Spielerdaten im Cache: <white>{players}</white> <dark_gray>|</dark_gray> Event: {event}'
  - '<gray>Tasks: <white>{tasks}</white> <dark_gray>|</dark_gray> RAM: <white>{memory}</white> <dark_gray>|</dark_gray> Resource Pack: <white>{pack}'
  - '<gray>Config-Warnungen: <white>{warnings}'
  last-error: '<red>Last DB error: <gray>{error}'
  warning: <gold>⚠ <gray>{warning}
protection:
  denied: '<red>✖ <gray>That is not allowed here: <white>{flag}'
  bypass-on: <green>Region protection bypass is now <bold>ON</bold>.
  bypass-off: <yellow>Region protection bypass is now <bold>OFF</bold> – you are treated like a player.
  flags:
    pvp: PvP
    build: Building
    break: Breaking
    interact: Interacting
    use: Doors & switches
    container: Opening chests
    explosions: Explosions
    fire: Fire
    entity-damage: Hurting animals/entities
    mob-damage: Mob damage
    damage: Damage
    mob-spawning: Mob spawning
    hunger: Hunger
    item-drop: Dropping items
region:
  pos1: '<gray>Position 1 set: <white>{x}, {y}, {z}'
  pos2: '<gray>Position 2 set: <white>{x}, {y}, {z}'
  wand: '<gray>Region wand received: <white>left click = pos1</white>, <white>right click = pos2</white>.'
  no-selection: <red>Set pos1 and pos2 first (in the same world).
  invalid-name: <red>Name only with a-z, 0-9, _ and - (max. 32 characters).
  exists: <red>Region <white>{region}</white> already exists.
  created: <green>Region <white>{region}</white> created <gray>({size}, {volume} blocks).
  deleted: <green>Region <white>{region}</white> deleted.
  unknown: <red>Region <white>{region}</white> does not exist.
  none-here: <red>You are not standing in a region.
  is-arena: <red>{region} is an arena – use /mythos arena.
  spawn-delete-warning: '<yellow>Careful: that was the spawn region. It will be recreated on the next reload if auto-create is on.'
  info: '<gray>Region <white>{region}</white> <dark_gray>({type})</dark_gray>

    <gray>World: <white>{world}</white> <dark_gray>|</dark_gray> Area: <white>{bounds}</white>

    <gray>Priority: <white>{priority}</white> <dark_gray>|</dark_gray> Volume: <white>{volume}</white>

    <gray>Flags: <white>{flags}'
  list-header: '<gray>Regions: <white>{count}</white> <dark_gray>(+ {arenas} arena regions)'
  list-line: <dark_gray> • <#e9d5ff>{region} <gray>({world}, prio {priority}, {volume} blocks)
  unknown-flag: '<red>Unknown flag. Available: <white>{flags}'
  invalid-value: <red>Value must be true, false or none.
  flag-set: '<green>{region}: <white>{flag}</white> = <white>{value}'
  priority-set: '<green>{region}: priority = <white>{priority}'
  redefined: <green>Region <white>{region}</white> redefined ({volume} blocks).
  flags: '<gray>Flags: <white>{flags}'
  reloaded: <green>{count} regions reloaded.
spawn:
  name: Spawn
  set: '<green>Spawn set: <white>{location}'
  not-set: <red>No spawn has been set yet.
  item-name: "<!italic><gold><bold>To Spawn</bold> <gray>(right-click)"
  sent-other: <green>{player} was sent to spawn.
teleport:
  starting: <gray>Teleporting to <#e9d5ff>{target}</#e9d5ff> in <white>{seconds}s</white>…
  starting-still: <gray>Teleporting to <#e9d5ff>{target}</#e9d5ff> in <white>{seconds}s</white> – <yellow>don't move!
  countdown: <#e9d5ff>✦ Teleport to {target} in <white>{seconds}</white>…
  done: '<green>✔ Teleported: <white>{target}'
  cancelled-move: <red>Teleport cancelled – you moved.
  cancelled-damage: <red>Teleport cancelled – you took damage.
  invalid-target: <red>The destination can't be reached (world not loaded?).
  failed: <red>Teleport failed.
  cooldown: <red>Please wait <white>{seconds}s</white>.
  in-combat: <red>You are in combat! Wait <white>{seconds}s</white>.
homes:
  name: Home {home}
  set: <green>Home <white>{home}</white> set. <gray>({count}/{max})
  updated: <green>Home <white>{home}</white> updated. <gray>({count}/{max})
  deleted: <green>Home <white>{home}</white> deleted.
  not-found: <red>Home <white>{home}</white> does not exist. <gray>/homes
  none: <gray>You don't have a home yet. Set one with <#e9d5ff>/sethome [name]
  choose: <gray>You have several homes – <#e9d5ff>/home <name></#e9d5ff> or <#e9d5ff>/homes
  limit: <red>You reached the maximum of <white>{max}</white> homes. Higher ranks have more!
  invalid-name: <red>Home name only with letters, numbers, _ and - (max. 16).
  blocked-world: <red>You can't set a home in this world.
  no-arena: <red>You can't set a home in arenas.
  world-missing: <red>The world of home <white>{home}</white> is not loaded.
  list-header: '<gray>Your homes <dark_gray>({count}/{max})</dark_gray> – click to teleport:'
  list-entry: <#e9d5ff><u>{home}</u>
  list-separator: '<dark_gray>, '
  list-hover: '<gray>{home}

    <dark_gray>{world} {x} {y} {z}

    <green>Click: teleport'
tpa:
  self: <red>You can't send a request to yourself.
  sent: <gray>Request sent to <white>{player}</white> <dark_gray>(expires in {seconds}s).
  sent-here: <gray>Request sent to <white>{player}</white> to come to you <dark_gray>({seconds}s).
  received: <white>{player}</white> <gray>wants to teleport to you.
  received-here: <white>{player}</white> <gray>wants you to teleport to <white>them</white>.
  button-accept: <green><bold>[ACCEPT]</bold>
  button-deny: <red><bold>[DENY]</bold>
  hover-accept: <green>Accept teleport request
  hover-deny: <red>Deny teleport request
  already-pending: <red>You already sent {player} a request.
  target-full: <red>{player} has too many open requests.
  none: <red>You have no open teleport request.
  none-from: <red>No request from <white>{player}</white>.
  offline: <red>That player is no longer online.
  accepted-target: <green>Request from <white>{player}</white> accepted.
  accepted-sender: <green>{player} accepted your request!
  denied-target: <gray>Request from <white>{player}</white> denied.
  denied-sender: <red>{player} denied your request.
  cancelled: <gray>Your request was withdrawn.
  cancelled-target: <gray>{player} withdrew the request.
  no-outgoing: <red>You have no open request.
  expired-sender: <gray>Your request to <white>{player}</white> expired.
  expired-target: <gray>The request from <white>{player}</white> expired.
  left: <gray>{player} left the server – request removed.
  failed: <red>Teleport not possible for {player}.
  in-combat: <red>You are in combat – no teleport possible.
  into-arena: <red>Teleports into arenas are not allowed.
  into-pvp: <red>Teleports into PvP areas are not allowed.
economy:
  names:
    coins: Coins
    gems: Gems
  balance: '<gray>Your balance: {icon_coin} <gold>{coins} Coins</gold> <dark_gray>|</dark_gray> {icon_gem} <light_purple>{gems} Gems'
  balance-other: '<gray>{player}: {icon_coin} <gold>{coins} Coins</gold> <dark_gray>|</dark_gray> {icon_gem} <light_purple>{gems} Gems'
  coins: <gray>You have {icon} <gold>{coins} Coins</gold>.
  coins-other: <gray>{player} has {icon} <gold>{coins} Coins</gold>.
  gems: <gray>You have {icon} <light_purple>{gems} Gems</light_purple>.
  gems-other: <gray>{player} has {icon} <light_purple>{gems} Gems</light_purple>.
  paid: '<green>You sent <white>{player}</white> <gold>{amount} {currency}</gold>. <gray>New balance: {balance}'
  received: <green>You received <gold>{amount} {currency}</gold> from <white>{player}</white>!
  not-enough: <red>Not enough {currency}! You only have <white>{balance}</white>.
  invalid-amount: '<red>Invalid amount. Allowed: whole number above 0 (max. {max}), e.g. 500, 1k, 2.5k.'
  pay-self: <red>You can't send money to yourself.
  pay-cooldown: <red>Please wait {seconds}s before the next transfer.
  limit: <red>{player} already has the maximum balance.
  disabled: <red>This currency is disabled.
  not-transferable: <red>{currency} can't be transferred.
  admin-done: '<green>{player}: {action} {amount} {currency} → new balance <white>{balance}'
  admin-notify: '<gray>Your {currency} balance was adjusted by the team: <white>{balance}'
multiplier:
  coins: Coins
  gems: Gems
  events: Events
  new-day: '<gold>☀ New day!</gold> <gray>Multipliers today – Coins: <white>x{coins}</white>, Gems: <white>x{gems}</white>, Events: <white>x{events}'
booster:
  started: <gradient:#22c55e:#a3e635><bold>BOOSTER!</bold></gradient> <white>{type} x{factor}</white> <gray>for <white>{duration}</white> <dark_gray>(started by {player})
  ended: <gray>The {type} booster has expired.
  stopped: <gray>{type} booster stopped.
  none: <red>No booster is running for this type.
  info-header: <gray>Multipliers today <dark_gray>({day})
  info-line: '<dark_gray> • <#e9d5ff>{type}: <gray>day x{daily} <dark_gray>|</dark_gray> booster {booster} <dark_gray>|</dark_gray> <white>total x{total}'
daily:
  claimed: '<green>✔ Daily reward: <gold>+{coins} Coins</gold> <gray>(streak: <white>{streak}</white> days)'
  bonus-gems: '<light_purple>✦ Streak bonus: +{gems} Gems <gray>for {streak} days in a row!'
  already: <gray>Already claimed! Next reward in <white>{time}</white>.
  streak-hint: '<dark_gray>Tip: claim /daily every day – the reward grows with your streak.'
  reminder: '<gold>☀ <gray>Your daily reward is waiting: <#e9d5ff><click:run_command:/daily><u>/daily</u></click>'
  disabled: <red>The daily reward is disabled.
  milestone: '<gold>🔥 {streak} day streak! Bonus: {reward}'
  milestone-broadcast: <gold>🔥 {player} <yellow>has a {streak} day login streak!
  claimed-gems: '<green>Daily reward claimed: <light_purple>+{gems} Gems</light_purple> <gray>(streak: {streak} days) – a gem day today!'
rewards:
  mob-kill: <gold>+{coins} Coins
  player-kill: <gold>+{coins} Coins <gray>for {player}
  playtime: <green>Thanks for playing! <gold>+{coins} Coins</gold> <gray>for {minutes} active minutes.
  playtime-gems: <green>Thanks for playing! <gold>+{coins} Coins</gold> <light_purple>+{gems} Gems</light_purple> <gray>for {minutes} active minutes.
  describe:
    coins: <gold>{amount} Coins
    gems: <light_purple>{amount} Gems
    xp: <green>{amount} XP
    key: <white>{amount}× </white>{crate} <gray>key
    tool: <white>{amount}× </white>{item}
    item: <white>{amount}× </white>{item}
    command: <white>Special reward
    voucher: <white>{amount}× </white><gold>Rank voucher</gold> {rank} <gray>({duration})
    book: <white>{amount}× </white><aqua>Book:</aqua> {enchantment}
    spawner: <white>{amount}× <light_purple>{mob} spawner
death:
  broadcast: <dark_gray>☠ <gray>{player} died.
  broadcast-killed: <dark_gray>☠ <gray>{player} was killed by <red>{killer}</red>.
  killstreak: <gold>✹ {player}</gold> <gray>is on a <red><bold>{streak} killstreak</bold></red>!
rank:
  set: '<green>{player} now has the rank {rank} <gray>(duration: {duration}).'
  received: '<gradient:#c084fc:#f59e0b>✦ You received the rank</gradient> {rank}<gradient:#f59e0b:#c084fc>! ✦</gradient> <gray>(duration: {duration})'
  expired: <gray>Your rank has expired.
  unknown: <red>Rank <white>{rank}</white> does not exist. <gray>/rank list
  invalid-duration: '<red>Invalid duration. Examples: 7d, 30d, 12h, perm'
  info: '<gray>{player}: rank {rank} <dark_gray>|</dark_gray> <gray>time left: <white>{remaining}'
  list-header: '<gray>Ranks:'
  list-line: <dark_gray> • </dark_gray>{rank} <dark_gray>({id}, weight {weight}, {homes} homes, coins x{multiplier})
  mythos-owner-only: <red>Only <white>{owner}</white> can give or remove the <gradient:#c084fc:#f59e0b><bold>MYTHOS</bold></gradient><red> rank.
  owner-locked: <red>The rank of <white>{owner}</white> is fixed and can't be changed.
  mythos-granted: <gradient:#c084fc:#f59e0b><bold>✦ {owner} raised {player} to the MYTHOS rank! ✦</bold></gradient>
  owner-only-rank: <red>Only <white>{owner}</white> can give or remove the rank {rank}<red>.
join:
  mythos-title: <gradient:#c084fc:#f59e0b><bold>✦ MYTHOS ✦</bold></gradient>
  mythos-subtitle: <#e9d5ff>{player} <gray>is online
chat:
  hover: '{rank} <white>{player}</white>

    <gray>Coins: <gold>{coins}</gold>

    <gray>Kills: <white>{kills}</white>

    <dark_gray>Click: write a message'
helpop:
  format: '<red><bold>[HelpOp]</bold></red> <white>{player}</white><gray>: <yellow>{message}'
  hover: '<gray>Click: /tp {player}'
  sent: <green>Your message was sent to the team.
  sent-offline: <yellow>No team member is online right now – your message was saved.
  cooldown: <red>Please wait {seconds}s.
stats:
  names:
    coins: Coins
    gems: Gems
    kills: Kills
    deaths: Deaths
    playtime: Playtime
    eventpoints: Event points
    eventswon: Event wins
    bossdamage: Boss damage
    mobkills: Mob kills
    relics: Relics
    crates: Crates opened
    streak: Best killstreak
  show:
  - <dark_gray><st>                                        </st>
  - <gradient:#c084fc:#f59e0b><bold>{player}</bold></gradient> <dark_gray>|</dark_gray> {rank}
  - '<gray>Coins: <gold>{coins}</gold>  <dark_gray>|</dark_gray>  Gems: <light_purple>{gems}'
  - '<gray>Kills: <white>{kills}</white>  Tode: <white>{deaths}</white>  K/D: <white>{kd}</white>  Beste Streak: <white>{streak}'
  - '<gray>Mob-Kills: <white>{mobkills}</white>  <dark_gray>|</dark_gray>  Spielzeit: <white>{playtime}'
  - '<gray>Event-Punkte: <white>{event_points}</white>  Siege: <white>{events_won}</white>  Boss-Schaden: <white>{boss_damage}'
  - '<gray>Relikte: <white>{relics}</white>  Kisten: <white>{crates}</white>  Daily-Streak: <white>{daily_streak}'
  - <dark_gray><st>                                        </st>
  unknown: '<red>Unknown stat. Available: <white>{stats}'
  top-header: <gradient:#c084fc:#f59e0b><bold>Top 10 – {stat}</bold></gradient>
  top-line-podium: <gold>#{place}</gold> <white>{player}</white> <dark_gray>–</dark_gray> <#e9d5ff>{value}
  top-line: <gray>#{place} {player} <dark_gray>–</dark_gray> <white>{value}
  top-empty: <gray>No entries yet.
holograms:
  title: <gradient:#c084fc:#f59e0b><bold>✦ Top {stat} ✦</bold></gradient>
  line-top: <gold>#{place}</gold> <white>{player}</white> <dark_gray>–</dark_gray> <#e9d5ff>{value}
  line: <gray>#{place} {player} <dark_gray>–</dark_gray> <white>{value}
  empty: <gray>No entries yet
  loading: <gray>Loading…
  created: <green>Hologram <white>{name}</white> created.
  deleted: <green>Hologram <white>{name}</white> deleted.
  unknown: <red>Hologram <white>{name}</white> does not exist.
  list-header: '<gray>Holograms: <white>{count}'
  list-line: <dark_gray> • <#e9d5ff>{name} <gray>({stat}) {location}
arena:
  states:
    disabled: <red>closed
    waiting: <green>open
    running: <gold>running
    resetting: <yellow>resetting
  list-header: '<gray>Arenas:'
  list-line: <dark_gray> • <#e9d5ff>{arena} <gray>– {state} <dark_gray>({players}/{max})
  unknown: <red>Arena <white>{arena}</white> does not exist.
  exists: <red>Arena <white>{arena}</white> already exists.
  created: '<green>Arena <white>{arena}</white> created. <gray>Next steps: setspawn, (setspectator), enable.'
  deleted: <green>Arena <white>{arena}</white> deleted.
  disabled: <red>Arena <white>{arena}</white> is closed.
  disabled-admin: <yellow>Arena <white>{arena}</white> closed.
  enabled: <green>Arena <white>{arena}</white> is now open.
  resetting: <yellow>Arena <white>{arena}</white> is being reset – back in a moment!
  full: <red>Arena <white>{arena}</white> is full.
  no-spawns: <red>Arena <white>{arena}</white> has no spawn points yet.
  already-in: <red>You are already in an arena. <gray>/arena leave
  not-in: <red>You are not in an arena.
  joined: <green>Welcome to the arena <white>{arena}</white>! <gray>({players} players) – leave with <#e9d5ff>/arena leave
  spectating: <gray>You are watching arena <white>{arena}</white>. Leave with <#e9d5ff>/arena leave
  left: <gray>You left the arena <white>{arena}</white>.
  player-joined: <green>+ <white>{player}</white> <gray>({players} players)
  player-left: <red>- <white>{player}</white> <gray>({players} players)
  closed: <yellow>Arena <white>{arena}</white> was closed.
  leave-first: <red>Leave the arena first with <white>/arena leave</white>.
  command-blocked: <red>This command is blocked in the arena. <gray>/arena leave
  restore-failed: <red>Your inventory could not be restored – it is saved, please contact the team!
  recovered: <green>Your inventory from the arena <white>{arena}</white> was restored after a restart.
  outside: <red>You are not standing in arena <white>{arena}</white>.
  spawn-added: '<green>Spawn point #{count} for <white>{arena}</white> set.'
  spawns-cleared: <green>All spawn points of <white>{arena}</white> deleted.
  spectator-set: <green>Spectator spawn for <white>{arena}</white> set.
  unknown-setting: '<red>Unknown option. Available: <white>{settings}'
  invalid-value: <red>Invalid value for <white>{setting}</white>.
  unknown-kit: '<yellow>Note: kit <white>{kit}</white> does not exist. Existing kits: {kits}'
  setting-set: '<green>{arena}: <white>{setting}</white> = <white>{value}'
  redefined: <green>Area of <white>{arena}</white> redefined. Remember to take a new snapshot!
  info: '<gray>Arena <white>{arena}</white> – {state}

    <gray>World: <white>{world}</white> <dark_gray>|</dark_gray> Area: <white>{bounds}</white>

    <gray>Spawns: <white>{spawns}</white> <dark_gray>|</dark_gray> Spectator: <white>{spectator}</white> <dark_gray>|</dark_gray> Players: <white>{players}</white> <dark_gray>|</dark_gray> Snapshot: <white>{snapshot}</white>

    <gray>Settings: <white>{settings}'
  snapshot-started: <gray>Creating snapshot of <white>{arena}</white> ({volume} blocks)…
  snapshot-done: <green>Snapshot of <white>{arena}</white> saved ({ms} ms).
  snapshot-failed: '<red>Snapshot failed: {error}'
  no-snapshot: <red>Arena <white>{arena}</white> has no snapshot. <gray>/mythos arena snapshot {arena}
  reset-started: <gray>Resetting arena <white>{arena}</white>…
  reset-done: <green>Arena <white>{arena}</white> was reset.
  reset-failed: '<red>Reset of {arena} failed: {error}'
resourcepack:
