      prefix: '<gradient:#2dd4bf:#0f766e><bold>SUP</bold></gradient> <dark_gray>| '
      badge: supporter
      team-color: dark_aqua
      chat-color: white
      homes: 10
      coin-multiplier: 1.0
      gem-multiplier: 1.0
