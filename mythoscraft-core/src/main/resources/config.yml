# ───────────────────────────── Auktionshaus (/ah) ─────────────────────────────
auction:
  enabled: true
  # Wie lange ein Angebot im Auktionshaus bleibt (danach: /ah abholen)
  duration-hours: 48
  # Gleichzeitige Angebote pro Spieler (mehr je Rang, Permission mythos.auction.unlimited = unbegrenzt)
  max-listings: 5
  max-listings-by-rank:
    VIP: 8
    ELITE: 12
    MYTHOS: 30
  # Steuer in Prozent, die vom Verkaufserlös abgezogen wird (Geld verschwindet aus der Wirtschaft)
  tax-percent: 5
  min-price: 1
  max-price: 1000000000
  # Dürfen Items auch für Gems verkauft werden?
  allow-gems: true
  # Neue Angebote im Chat ankündigen (klickbar)
  broadcast-new: true
  # Items, die nicht verkauft werden dürfen (Admin-Blöcke, Spawn-Eier usw. sind immer gesperrt)
  blocked-items: []

# ───────────────────────────── Farmaufträge (/auftrag) ─────────────────────────────
farm-orders:
  enabled: true
  # Laufzeit eines Auftrags; danach bekommt der Auftraggeber die restlichen Coins zurück
  duration-days: 7
  # Gleichzeitige offene Aufträge pro Spieler (mythos.orders.unlimited = unbegrenzt)
  max-orders: 3
  # Höchstmenge pro Auftrag (2304 = 36 Stacks)
  max-amount: 2304
  # Preis pro Stück in Coins
  min-price-each: 1
  max-price-each: 100000
  broadcast-new: true
  # Items, die nicht bestellt werden dürfen (zusätzlich zu Admin-Blöcken und Spawn-Eiern)
  blocked-items: [DRAGON_EGG, ELYTRA, NETHER_STAR, BEACON, ENCHANTED_GOLDEN_APPLE]

# ───────────────────────────── Bauen (/spawn place, /mythos arena place) ─────────────────────────────
build:
  blocks-per-tick: 12000
  # Kisten, die auf den Sockeln des Spawns aufgestellt werden (Reihenfolge = Sockel)
  spawn-crates: [common, vip, elite, mythos, ancient, halloween, frostfest, celestial, inferno, farm, storm, dragon, rang, ocean, forest, sky, crystal, millennium, cosmetic, space, spawner, silvester, shadow]
  auto-arenas: true

rtp:
  enabled: true
  countdown-seconds: 3
  cooldown-seconds: 300
  cooldown-by-rank:
    VIP: 240
    VIPPLUS: 180
    ELITE: 150
    HELD: 120
    LEGENDE: 90
    TITAN: 60
    MYTHOS: 0
  cost-coins: 0
  attempts: 25
  avoid-regions: true
  default-world: world
  worlds:
    world:
      min-radius: 300
      max-radius: 5000
      center: spawn
    world_nether:
      min-radius: 100
      max-radius: 2000
      center: spawn
    world_the_end:
      min-radius: 1200
      max-radius: 4000
      center: spawn

