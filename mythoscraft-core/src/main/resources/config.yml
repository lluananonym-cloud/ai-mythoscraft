# ───────────────────────────── Admin-Website ─────────────────────────────
# Eigene Website direkt aus dem Plugin: Live-Statistiken, Spieler, Aktionen per Knopf, Konsole, Config.
# Anmelden: auf der Website "Mit Server anmelden" → Code → ingame /website login <Code>.
# Zugriff hat immer MinePro641, weitere nur per /website allow <Spieler> <view|edit|admin>.
# Port muss beim Hoster freigegeben sein (wie beim Resourcepack). Für HTTPS: public-url hinter einem Proxy eintragen.
web-panel:
  enabled: true
  # Die komplette Website (Wiki, Kisten-Simulator, Tagesbelohnung, Mod-Bewerbung, Team-Panel) läuft direkt im Plugin.
  # MineKeep erlaubt nur die Ports 2053, 2083, 2087, 2096 (2053 = Resource Pack) → Website auf 2083.
  port: 2083
  bind: "0.0.0.0"
  # Öffentliche Adresse der Website (ohne / am Ende)
  public-url: "https://mythoscraftsmp.minekeep.dev:2083"
  # Nur für Spezialfälle: externe Relay-Seite (leer = aus, nicht nötig)
  relay:
    url: ""
    secret: ""

# Moderator-Bewerbung auf der Website (Spieler melden sich mit ihrem Minecraft-Konto an).
# Ingame lesen und beantworten: /applications (Recht mythos.applications, Standard: OP)
mod-applications:
  enabled: true
  min-playtime-hours: 5
  # Wartezeit nach einer Absage, bis man sich neu bewerben kann
  cooldown-days: 14
  # Jede Bewerbung kommt per E-Mail (FormSubmit) – mit Links zum Annehmen/Ablehnen. Die allererste Mail von FormSubmit
  # ist eine Aktivierungs-Mail: einmal bestätigen, danach kommen alle Bewerbungen an. Leer = keine Mail.
  email: "lluan.anonym@gmail.com"
  # Rang, den ein angenommener Bewerber bekommt
  accept-rank: MOD
  # optional zusätzlich ein Konsolen-Befehl beim Annehmen ({player} = Name), leer = keiner
  accept-command: ""
  questions:
    - "How old are you?"
    - "What is your Discord name?"
    - "How many hours per week can you be online, and at which times?"
    - "Have you been a moderator before? Where and for how long?"
    - "Why do you want to be a moderator on MythosCraft?"
    - "A player insults others in chat and ignores your warning. What do you do?"
    - "Two players accuse each other of stealing from a chest. How do you handle it?"
    - "Anything else you want to tell us?"

