    MOD:
      weight: 70
      display: <gradient:#60a5fa:#1d4ed8><bold>MOD</bold></gradient>
      prefix: '<gradient:#60a5fa:#1d4ed8><bold>MOD</bold></gradient> <dark_gray>| '
      badge: mod
      team-color: blue
      chat-color: white
      homes: 15
      coin-multiplier: 1.0
      gem-multiplier: 1.0
      daily-bonus: 0
      owner-only: true
      permissions:
      - mythos.helpop.receive
      - mythos.chat.color
      - mythos.auction.admin
      - mythos.orders.admin
      - mythos.teleport.instant
    ADMIN:
      weight: 80
      display: <gradient:#f87171:#b91c1c><bold>ADMIN</bold></gradient>
      prefix: '<gradient:#f87171:#b91c1c><bold>ADMIN</bold></gradient> <dark_gray>| '
      badge: admin
      team-color: red
      chat-color: white
      homes: 50
      coin-multiplier: 1.0
      gem-multiplier: 1.0
      daily-bonus: 0
      owner-only: true
      permissions:
      - mythos.admin
    OWNER:
      weight: 90
      display: <gradient:#ef4444:#7f1d1d><bold>OWNER</bold></gradient>
      prefix: '<gradient:#ef4444:#7f1d1d><bold>OWNER</bold></gradient> <dark_gray>| '
      badge: owner
      team-color: dark_red
      chat-color: white
      homes: 100
      coin-multiplier: 1.0
      gem-multiplier: 1.0
      daily-bonus: 0
      owner-only: true
      permissions:
      - mythos.admin
chat:
  # Auf false setzen, wenn ein anderes Chat-Plugin das Format übernimmt
  enabled: true
  format: "{badge}{name} <dark_gray>»</dark_gray> {message}"
  # Namen im Chat werden für den Erwähnten hervorgehoben (+ Ton)
  mentions: true

join-messages:
  enabled: true
  join: "<dark_gray>[<green>+</green>]</dark_gray> {badge}{name}"
  quit: "<dark_gray>[<red>-</red>]</dark_gray> {badge}{name}"
  # wer per /plot auf den Plot-Server wechselt
  to-plots: "<dark_gray>[<aqua>✈</aqua>]</dark_gray> {badge}{name} <gray>went to the plot world"
  first-join: "<gradient:#c084fc:#f59e0b>✦ Willkommen {player} auf MythosCraft! ✦</gradient> <gray>(Spieler #{number})"
  # Titel + Effekte, wenn ein MYTHOS-Spieler online kommt
  mythos-announce: true

scoreboard:
  enabled: true
  title: "<gradient:#c084fc:#f59e0b><bold>✦ MythosCraft ✦</bold></gradient>"
  # Platzhalter: {player} {rank} {coins} {gems} {kills} {deaths} {kd} {playtime} {mobkills} {killstreak}
  # {daily_streak} {event_points} {event} {online} {max} {tps} {ping} {world} {boost_coins} {boost_gems} {boost_events}
  # Icons (mit Resource Pack als Grafik): {icon_coin} {icon_gem} {icon_kill} {icon_death} {icon_time} {icon_event}
  # {icon_key} {icon_rank} {icon_streak}
  lines:
    - "<dark_gray><st>                         </st>"
    - "{icon_rank} <gray>Rang</gray> <dark_gray>»</dark_gray> {rank}"
    - "{icon_coin} <gray>Coins</gray> <dark_gray>»</dark_gray> <gold>{coins}"
    - "{icon_gem} <gray>Gems</gray> <dark_gray>»</dark_gray> <light_purple>{gems}"
    - ""
    - "{icon_kill} <gray>Kills</gray> <dark_gray>»</dark_gray> <white>{kills}"
    - "{icon_death} <gray>Tode</gray> <dark_gray>»</dark_gray> <white>{deaths}"
    - "{icon_time} <gray>Spielzeit</gray> <dark_gray>»</dark_gray> <white>{playtime}"
    - " "
    - "{icon_event} <gray>Event</gray> <dark_gray>»</dark_gray> {event}"
    - "{icon_streak} <gray>Boost</gray> <dark_gray>»</dark_gray> <green>x{boost_coins}"
    - "{icon_event} <gray>Saison</gray> <dark_gray>»</dark_gray> {season}"
    - "<dark_gray><st>                         </st> "
    - "<gradient:#c084fc:#f59e0b>mythoscraft.online</gradient>"
  update-interval-ticks: 20
  # Spätestens nach so vielen Ticks wird alles neu berechnet (z.B. für Event-Timer)
  full-refresh-ticks: 100

nametags:
  # Rang-Badge vor dem Namen (Tab-Liste + über dem Kopf)
  enabled: true

tablist:
  enabled: true
  header:
    - "<gradient:#c084fc:#f59e0b><bold>MythosCraft</bold></gradient>"
    - "<gray>Online: <white>{online}</white>/<white>{max}</white>"
  footer:
    - ""
    - "<gray>Event: {event}"
    - "<gray>Ping: <white>{ping}ms</white>  <dark_gray>•</dark_gray>  <gray>TPS: <white>{tps}"
    - "<gradient:#c084fc:#f59e0b>mythoscraft.online</gradient>"
  logo-padding-lines: 2
  update-interval-ticks: 100

# ───────────────────────────── Resource Pack ─────────────────────────────
# Das Pack (Rang-Badges, Crate- und Tool-Modelle, GUI-Hintergründe) steckt im Plugin.
resource-pack:
  enabled: true
  # true = ohne Pack kein Beitritt
  required: true
  # Externer Link (z.B. download.mc-packs.net). LEER lassen = das Plugin liefert das Pack selbst aus (self-host unten).
  # MineKeep erlaubt nur bestimmte Hoster (*.minekeep.dev, download.mc-packs.net, github.com, dropbox.com …)!
  url: ""
  # SHA-1 der Datei unter "url" – leer lassen bei mc-packs.net (steht im Link) und bei self-host
  sha1: ""
  self-host:
    # Das Plugin startet einen kleinen Webserver und schickt immer automatisch das aktuelle Pack aus der JAR
    enabled: true
    bind: 0.0.0.0
    # MineKeep erlaubt nur die Ports 2053, 2083, 2087 und 2096
    port: 2053
    # Öffentliche Adresse ohne Pfad. MineKeep: https://<Servername>.minekeep.dev:<Port>
    public-url: "https://mythoscraftsmp.minekeep.dev:2053"
    # Nur genutzt, wenn public-url leer ist (dann http://public-host:port)
    public-host: mythoscraft.online
  send-delay-ticks: 20
  # Nur setzen, wenn alle Spieler das Pack manuell installiert haben
  assume-loaded: false

helpop:
  cooldown-seconds: 30

# ───────────────────────────── Custom Tools ─────────────────────────────
tools:
  mythos-hammer:
    enabled: true
    # Härteste abbaubare Blöcke im 3x3 (Obsidian = 50)
    max-hardness: 50
  excavator:
    enabled: true
  timber-axe:
    enabled: true
    max-logs: 128
  warden-blade:
    enabled: true
    damage: 10
    range: 16
    cooldown-seconds: 8
  meteor-staff:
    enabled: true
    damage: 8
    radius: 3.5
    range: 40
    cooldown-seconds: 15

# ───────────────────────────── Events ─────────────────────────────
events:
  enabled: true
  auto:
    # off, interval (alle X Minuten ein zufälliges Event) oder times (feste Uhrzeiten)
    mode: interval
    interval-minutes: 45
    min-players: 2
    times: ["18:00", "20:00", "22:00"]
  # Event-Punkte (Statistik) für Platz 1, 2, 3, … (letzter Wert gilt für alle weiteren Teilnehmer)
  placement-points: [10, 7, 5, 3, 1]

  coinrain:
    enabled: true
    # Ort: spawn | player (bei jedem Spieler) | arena:<name> | wild:<min>-<max> (/event tp beamt hin)
    venue: spawn
    duration-seconds: 90
    countdown-seconds: 30
    weight: 30
    cooldown-minutes: 30
    min-players: 1
    # leer = alle Welten
    worlds: []
    bossbar-color: YELLOW
    wave-interval-seconds: 2
    coins-per-wave: 3
    radius: 9
    coin-value: {min: 5, max: 25}
    golden-coin: {chance: 0.03, multiplier: 10}
    despawn-seconds: 20
    rewards:
      places:
        1: ["coins 300", "key common 1"]
        2: ["coins 150"]
        3: ["coins 75"]
      participation: []
      participation-min-score: 1

  gemrush:
    enabled: true
    # Ort: spawn | player (bei jedem Spieler) | arena:<name> | wild:<min>-<max> (/event tp beamt hin)
    venue: player
    duration-seconds: 300
    countdown-seconds: 30
    weight: 20
    cooldown-minutes: 45
    min-players: 1
    worlds: []
    bossbar-color: PURPLE
    points:
      hostile-mob: 2
      ores:
        COAL_ORE: 1
        DEEPSLATE_COAL_ORE: 1
        COPPER_ORE: 1
        DEEPSLATE_COPPER_ORE: 1
        IRON_ORE: 2
        DEEPSLATE_IRON_ORE: 2
        GOLD_ORE: 3
        DEEPSLATE_GOLD_ORE: 3
        NETHER_GOLD_ORE: 2
        NETHER_QUARTZ_ORE: 1
        REDSTONE_ORE: 2
        DEEPSLATE_REDSTONE_ORE: 2
        LAPIS_ORE: 3
        DEEPSLATE_LAPIS_ORE: 3
        DIAMOND_ORE: 10
        DEEPSLATE_DIAMOND_ORE: 10
        EMERALD_ORE: 15
        DEEPSLATE_EMERALD_ORE: 15
        ANCIENT_DEBRIS: 25
        AMETHYST_CLUSTER: 4
    shard-chance: 0.08
    points-per-gem: 20
    max-gems-per-player: 25
    rewards:
      places:
        1: ["gems 15", "key elite 1"]
        2: ["gems 10"]
        3: ["gems 5"]
      participation: ["coins 50"]
      participation-min-score: 5

  ancienthunt:
    enabled: true
    # Ort: spawn | player (bei jedem Spieler) | arena:<name> | wild:<min>-<max> (/event tp beamt hin)
    venue: "wild:800-2500"
    duration-seconds: 600
    countdown-seconds: 30
    weight: 20
    cooldown-minutes: 60
    min-players: 1
    worlds: []
    bossbar-color: PURPLE
    # leer = Welt des Spawns
    world: ""
    # "spawn" oder "x,z"
    center: spawn
    relics: 8
    radius: {min: 40, max: 250}
    points-per-relic: 10
    coins-per-relic: 100
    hint-radius: 60
    collect-radius: 2.2
    beam: true
    rewards:
      places:
        1: ["coins 750", "gems 10", "key mythos 1"]
        2: ["coins 400", "gems 5"]
        3: ["coins 200", "gems 3"]
      participation: ["coins 50"]
      participation-min-score: 1

  meteor:
    enabled: true
    # Ort: spawn | player (bei jedem Spieler) | arena:<name> | wild:<min>-<max> (/event tp beamt hin)
    venue: "wild:1500-4000"
    duration-seconds: 300
    countdown-seconds: 30
    weight: 20
    cooldown-minutes: 45
    min-players: 1
    worlds: []
    bossbar-color: RED
    meteors: 3
    first-delay-seconds: 15
    interval-seconds: 70
    warning-seconds: 15
    # Abstand des Einschlags zu einem zufälligen Spieler
