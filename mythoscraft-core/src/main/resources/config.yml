      prefix: '<gradient:#facc15:#a16207><bold>BUILDER</bold></gradient> <dark_gray>| '
      badge: builder
      team-color: yellow
      chat-color: white
      homes: 15
      coin-multiplier: 1.0
      gem-multiplier: 1.0
      daily-bonus: 0
