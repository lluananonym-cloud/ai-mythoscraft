  # ── Zeitplan ─────────────────────────────────────────────────────────────
  # Ersetzt "auto": stündlich ein leichtes Event, 1x am Tag ein Boss/längeres Event (zufällige Uhrzeit im Fenster),
  # freitags 17:00 ein langes Wochen-Event, am letzten Tag im Monat der Mythos-Titan, am Wochenende/Monatsende/
  # Feiertagen den ganzen Tag eine Schatzsuche im Hintergrund. Saison-Events kommen in ihrer Saison viel öfter dran.
  schedule:
    enabled: true
    season-boost: 4
    hourly:
      minute: 30
      min-players: 1
      pool: [coinrain, goldrush, keyrain, diamondrain, crystalhunt, featherfall, mushroomhunt, chickenhunt, pigchase,
        slimeplague, spidernight, mobhunt, fishing, harvest, lumberjack, parkourrace, gemrush,
        pumpkinhunt, ghostnight, giftrain, snowballfight, starfall, egghunt, petalrain, luckrain, heartrain, shellhunt]
    daily:
      from: "17:00"
      to: "21:00"
      pool: [ancientwarden, spiderqueen, boneking, magmalord, swampwitch, stormknight, meteor, ancienthunt,
        pumpkinking, frostgiant, killerbunny]
    weekly:
      day: FRIDAY
      time: "17:00"
      duration-minutes: 60
      pool: [ancientwarden, gemrush, ancienthunt, stormknight]
    monthly:
      time: "19:00"
      duration-minutes: 45
      pool: [mythostitan]
    all-day:
      enabled: true
      from: "10:00"
      to: "22:00"
      days: [SATURDAY, SUNDAY]
      last-day-of-month: true
      holidays: ["10-31", "12-24", "12-25", "12-26", "12-31", "01-01"]
      pool: [treasurehunt]
# ───────────────────────────── Schmied (/schmied) ─────────────────────────────
# Waffen, Rüstung und Werkzeuge von +1 bis +10 verbessern. Ab +7 kann es schiefgehen (Item bleibt, Material weg).
upgrades:
  enabled: true
  max-level: 10
  # Erfolgschance in % für +1 … +10
  success-chance: [100, 100, 100, 100, 100, 100, 80, 65, 50, 35]
  # Coins: coins-base × Stufe² (also +1 = 1.500, +10 = 150.000)
  coins-base: 1500
  gems-per-level: 3
  # Material pro Stufe (MATERIAL:Anzahl) für +1 … +10
  materials: ["DIAMOND:2", "DIAMOND:4", "DIAMOND:8", "NETHERITE_SCRAP:1", "NETHERITE_SCRAP:2", "NETHERITE_SCRAP:3",
    "ECHO_SHARD:2", "ECHO_SHARD:4", "NETHER_STAR:1", "NETHER_STAR:2"]
  bonus:
    # Waffen/Bögen: +5 % Schaden pro Stufe
    damage-per-level: 0.05
    # Rüstung: -1 % Schaden pro Stufe und Teil (max. 35 %)
    armor-per-level: 0.01
    armor-max: 0.35

# ───────────────────────────── Kisten-Karussell ─────────────────────────────
# Am Spawn stehen nur 10 Sockel: 4 feste Kisten, 5 wechselnde (alle swap-seconds die nächste) und 1 Event-Sockel.
# Event-Kisten stehen NUR während ihres Events dort (Kiste: Saison-ID; Silvester zusätzlich am 31.12.).
crate-carousel:
  enabled: true
  swap-seconds: 180
  fixed: [common, vip, elite, mythos]
  event-crates:
    halloween: halloween
    frostfest: frostfest
    silvester: neujahr
  # Kisten, die nie im Karussell erscheinen
  never: []
  # Relikt-Sockel: bei JEDEM Kistenwechsel eine kleine Chance, dass dort eine Relikt-Kiste erscheint
  relic:
    enabled: true
    # wie lange eine erschienene Relikt-Kiste stehen bleibt (Minuten)
    minutes: 20
    # Chance pro Kistenwechsel (0.01 = 1 %). Die seltenste Stufe wird zuerst gewürfelt.
    chances:
      relic4: 0.004
      relic3: 0.012
      relic2: 0.03
      relic1: 0.06

# Plot-Server (eigener Server mit dem MythosPlots-Plugin). MineKeep verbindet seine Server mit dem eigenen
# Proxy-Befehl /mk join <server> – /plot zeigt dafür einen Knopf, ein Klick schickt den Befehl vom Spieler aus.
plot-server:
  enabled: true
  # 1. Versuch: direkt über den Proxy (Servername bei MineKeep)
  proxy-server: "mythoscraftsmpplot"
  # 2. Versuch, falls der Spieler nach 2 s noch da ist: Knopf, der diesen Befehl vom Spieler aus schickt
  join-command: "mk join mythoscraftsmpplot"
  # Plots für Teammitglieder (MOD und höher); Spieler: rank-perks.<Rang>.plots
  staff-plots: 5

# Ein Inventar für Survival- und Plot-Server: Inventar, Enderkiste, XP, Leben und Hunger wandern mit,
# der Plot-Server zeigt Rang, Coins und Gems von hier. Schlüssel: leer = automatisch erzeugt,
# übertragen mit /mythos synckey (Klick kopiert) → auf dem Plot-Server in den Chat einfügen.
server-sync:
  enabled: true
  key: ""
  # so lange wartet ein Spieler beim Zurückkommen auf sein Inventar vom Plot-Server
  wait-seconds: 20
  # Sicherungen pro Spieler (data/server-sync/backups) – ansehen und zurückspielen auf der Website unter /inventory (nur Admins)
  backups-per-player: 30

# Neue Spieler: [NEW]-Tag, Chat-Helfer, /thank, Belohnung fürs Durchziehen des Guides, Login-Streak beim Join
newbies:
  enabled: true
  # so lange (Spielzeit in Stunden) steht [NEW] hinter dem Namen
  new-tag-hours: 2
  # Tagesbelohnung (/daily) automatisch beim Join abholen – mit Streak-Titel
  auto-daily-on-join: true
  # Belohnung, wenn der Guide (Leucht-Spur) bis zum Ende gemacht wird
  guide-rewards:
    - "key mythos 1"
    - "coins 2500"
  thank:
    # Coins für den Helfer, wenn sich ein neuer Spieler mit /thank bedankt
    coins: 250
    max-per-new-player: 3
    max-per-helper-per-day: 5

# Erster eigener Platz: nach dem ersten /rtp ein geschützter Bereich um den Landepunkt (+ Truhe + Home "base")
starter-base:
  enabled: true
  # 10 = 21×21 Blöcke
  radius: 10
  move-cooldown-hours: 24
  chest:
    - "OAK_LOG 16"
    - "COBBLESTONE 32"
    - "TORCH 16"
    - "BREAD 12"
    - "WHITE_BED 1"
    - "CRAFTING_TABLE 1"
    - "FURNACE 1"
    - "STONE_PICKAXE 1"
    - "STONE_AXE 1"

# Tägliche Belohnung auf der Website: mit dem Minecraft-Konto anmelden (/website login <Code>) und 1× am Tag abholen.
# Die Serie zählt Tag 1 … 7 (danach wieder Tag 1, wer einen Tag auslässt, fängt neu an). Mehrere Belohnungen mit ";" trennen.
web-daily:
  enabled: true
  days:
    - "coins 500"
    - "coins 1000"
    - "key common 1"
    - "coins 2000; xp 300"
    - "gems 2"
    - "key vip 1; coins 1500"
    - "gems 5; key elite 1"

# Farm-Begleiter: Schleichen + Rechtsklick mit einem Begleiter auf den Boden → er farmt dort (Menü: Dauer & Radius)
# Biene = Felder, Pinguin = Angeln, Schneemann = Bäume, Geist = Zuckerrohr/Kaktus/Melonen, Drache = Erze, Schattenwürfel = Monster
companion-farm:
  enabled: true
  # so viele Begleiter darf jeder gleichzeitig farmen lassen
  max-per-player: 2
  # Reichweite ohne Upgrade und Blöcke mehr pro Reichweiten-Stufe
  base-radius: 8
  radius-per-level: 3
  # Upgrades im Begleiter-Menü (Gems). Preis = Grundpreis × nächste Stufe
  max-upgrade-level: 5
  upgrade-cost:
    speed: 15
    power: 15
    range: 10
    luck: 25
  # Winzige Chance pro Fund auf ein OP-Item (0.00005 = 0,005 %; Glücks-Upgrade erhöht sie pro Stufe)
  op-find:
    chance: 0.00005
    chance-per-luck-level: 0.00004
    # "item-id gewicht"
    items:
      - "sort_wand 20"
      - "repair_charm 20"
      - "infinite_bucket 15"
      - "spawner_booster 12"
      - "vein_pickaxe 10"
      - "growth_totem 8"
      - "paint_brush 6"
      - "concrete_mixer 6"
      - "soul_sword 3"
      - "dwarf_hat 3"
      - "bark_hand 1"
      - "power_drill 1"
      - "zap_pickaxe 0.5"

# Spawner-Booster (aus der Spawner-Kiste): Rechtsklick auf einen Spawner, stapelbar
spawner-booster:
  # höchste Stufe pro Spawner (jede Stufe: 40 % schneller, ab 4 Stufen mehr Mobs pro Spawn)
  max-level: 10

