# ╔══════════════════════════════════════════════════════════════════════╗
# ║                      MythosCraft – config.yml                        ║
# ╚══════════════════════════════════════════════════════════════════════╝
# Texte können &-Farbcodes, &#RRGGBB oder MiniMessage (<gold>, <gradient:#a:#b>…) nutzen.
# Ungültige Werte werden beim Start/Reload gemeldet und durch sichere Standardwerte ersetzt.
# Nach Änderungen: /mythos reload

# Nicht ändern: Damit ergänzt das Plugin nach Updates automatisch neue Einstellungen.
config-version: 32
# Bei einem Update werden diese Bereiche einmalig auf die neuen Standardwerte gesetzt (Version: [Pfade])
config-reset:
  30: [shop.entries]
  29: [plot-server]
  28: [web-panel.port, web-panel.public-url, web-panel.relay.url, server-links.links]
  25: [language.per-player, language.default]
  24: [attractions.wheel.daily-limit, attractions.wheel2.daily-limit, attractions.wheel2.segments]
  23: [attractions.wheel, attractions.wheel2]

# Zeitzone für Daily-Belohnung, Tages-Multiplikatoren, Event-Uhrzeiten und Tageswechsel.
timezone: Europe/Berlin

messages:
  # Überschreibt den Prefix aus messages.yml (Zeile löschen, um den aus messages.yml zu nutzen).
  prefix: "<gradient:#c084fc:#f59e0b><bold>MythosCraft</bold></gradient> <dark_gray>» "

database:
  # sqlite (Standard, keine Einrichtung nötig) oder mysql / mariadb
  type: sqlite
  file: mythoscraft.db
  mysql:
    host: localhost
    port: 3306
    database: mythoscraft
    user: mythoscraft
    password: ""
    ssl: false

autosave:
  # Spielerdaten werden zusätzlich beim Verlassen, bei Überweisungen und beim Stoppen gespeichert.
  interval-seconds: 300

# ───────────────────────────── Spawn ─────────────────────────────
spawn:
  enabled: true
  # Wird mit /setspawn gesetzt.
  location: {}
  teleport-delay: 3
  cancel-on-move: true
  respawn-at-spawn: true
  teleport-on-first-join: true
  teleport-on-join: false
  # Kompass "Zum Spawn" fest im Inventar (Rechtsklick = Teleport) – für Spieler ohne Chat
  item:
    enabled: true
    slot: 8
  protection:
    # Name der Schutzregion um den Spawn (per /mythos region redefine spawn anpassbar)
    region: spawn
    auto-create: true
    radius: 64
  # Regeln am Spawn (gelten für die Spawn-Region):
  pvp: false
  build: false
  break: false
  interact: false
  use: true
  container: false
  explosions: false
  fire: false
  entity-damage: false
  mob-damage: false
  damage: false
  mob-spawning: false
  hunger: false
  item-drop: true

# ───────────────────────────── Schutz ─────────────────────────────
protection:
  # Standard außerhalb aller Regionen ("Wildnis")
  wilderness:
    pvp: true
    build: true
    break: true
    interact: true
    use: true
    container: true
    explosions: true
    fire: true
    entity-damage: true
    mob-damage: true
    damage: true
    mob-spawning: true
    hunger: true
    item-drop: true
  # Abweichende Standards pro Welt, z.B.:
  # worlds:
  #   world_nether:
  #     pvp: false
  worlds: {}
  # Flags, die neue Regionen von /mythos region create bekommen
  new-region-defaults:
    pvp: false
    build: false
    break: false
    interact: false
    use: true
    container: false
    explosions: false
    fire: false
    entity-damage: false
  # Soll mythos.bypass auch PvP-Schutz umgehen?
  bypass-includes-pvp: false

# ───────────────────────────── Arenen ─────────────────────────────
arena:
  # Befehle, die in Arenen mit block-commands=true erlaubt bleiben
  allowed-commands: [arena, msg, r, helpop]
  snapshot:
    max-volume: 2000000
    capture-blocks-per-tick: 20000
    restore-blocks-per-tick: 4000

kits:
  pvp:
    items:
      - {material: DIAMOND_SWORD, enchantments: {sharpness: 1}}
      - BOW
      - ARROW 32
      - COOKED_BEEF 16
      - GOLDEN_APPLE 2
    helmet: IRON_HELMET
    chestplate: IRON_CHESTPLATE
    leggings: IRON_LEGGINGS
    boots: IRON_BOOTS
    offhand: SHIELD

# ───────────────────────────── Teleport ─────────────────────────────
teleport:
  cancel-on-damage: true
  # Sekunden nach PvP, in denen /home, /tpa und /arena join gesperrt sind
  combat-tag-seconds: 10
  sounds:
    countdown: "block.note_block.hat 0.6 1.6"
    success: "entity.enderman.teleport 0.8 1.2"
    cancel: "block.note_block.bass 0.8 0.6"
  tpa:
    timeout: 60
    cooldown: 10
    max-incoming: 5
    teleport-delay: 3
    cancel-on-move: true
    deny-into-arenas: true
    deny-into-pvp-areas: false

homes:
  # Lichtstrahl + Ring aus Partikeln über deinen Homes (sieht nur der Besitzer)
  particles:
    enabled: true
    view-distance: 96
  teleport-delay: 3
  cancel-on-move: true
  cooldown-seconds: 5
  # Anzahl Homes kommt vom Rang (ranks.list.<RANG>.homes)
  blocked-worlds: []

# ───────────────────────────── Economy ─────────────────────────────
economy:
  max-balance: 1000000000000
  coins:
    enabled: true
    start-balance: 100
  gems:
    enabled: true
    # Dürfen Gems per /pay ... gems überwiesen werden?
    transferable: false
  pay:
    max-amount: 1000000000
    cooldown-seconds: 3

# Tages-Multiplikatoren (Zeitzone siehe oben). Admins können zusätzlich Booster starten: /mythos boost
multipliers:
  announce-day-change: true
  daily:
    monday: {coins: 1.0, gems: 1.0, events: 1.0}
    tuesday: {coins: 1.0, gems: 1.0, events: 1.0}
    wednesday: {coins: 1.0, gems: 1.0, events: 1.25}
    thursday: {coins: 1.0, gems: 1.0, events: 1.0}
    friday: {coins: 1.25, gems: 1.0, events: 1.0}
    saturday: {coins: 1.5, gems: 1.25, events: 1.25}
    sunday: {coins: 1.5, gems: 1.25, events: 1.5}

daily:
  enabled: true
  base-coins: 100
  # + pro Streak-Tag (bis streak-cap)
  streak-bonus-coins: 25
  streak-cap: 7
  # alle X Streak-Tage zusätzlich Gems
  gems-every-days: 7
  gems-amount: 3
  sound: "entity.player.levelup 1 1.2"
  streak-milestones:
    7:
    - gems 5
    14:
    - gems 10
    30:
    - gems 25
    - voucher VIP 7d
    60:
    - gems 40
    100:
    - gems 75
    - voucher ELITE 30d
    365:
    - gems 250
  gem-chance: 0.3
  random-gems:
    min: 1
    max: 3

rewards:
  mob-kill:
    enabled: true
    min-coins: 1
    max-coins: 3
    # Mobs aus Spawnern geben keine Coins (gegen Mobfarmen)
    ignore-spawner-mobs: true
    special:
      WITHER: 250
      ENDER_DRAGON: 500
      ELDER_GUARDIAN: 75
      WARDEN: 100
  player-kill:
    coins: 15
    # Kein Reward, wenn derselbe Spieler innerhalb dieser Zeit erneut getötet wird
    same-victim-cooldown-minutes: 10
  killstreak-broadcasts: [5, 10, 15, 25]
  # Belohnung für aktive (nicht AFK) Spielzeit
  playtime:
    enabled: true
    interval-minutes: 30
    coins: 50
    gems: 0

deaths:
  broadcast: false
  hide-vanilla-messages: false

# ───────────────────────────── Ränge ─────────────────────────────
# Der Rang MYTHOS gehört MinePro641 und kann NUR von ihm vergeben werden (geprüft über seine UUID).
ranks:
  default: SPIELER
  # Text-Prefix für Teammitglieder (Permission mythos.team) ohne Resource Pack
  team-prefix: "&c&lTEAM &8| "
  list:
    SPIELER:
      weight: 0
      display: "&7Spieler"
      prefix: ""
      badge: ""
      team-color: gray
      chat-color: white
      homes: 3
      coin-multiplier: 1.0
      gem-multiplier: 1.0
      daily-bonus: 0
      permissions: []
    VIP:
      weight: 10
      display: "&a&lVIP"
      prefix: "&a&lVIP &8| "
      # Glyph aus dem Resource Pack (vip, elite, mythos)
      badge: vip
      team-color: green
      chat-color: white
      homes: 5
      coin-multiplier: 1.1
      gem-multiplier: 1.0
      daily-bonus: 50
      permissions: []
    ELITE:
      weight: 20
      display: "&b&lELITE"
      prefix: "&b&lELITE &8| "
      badge: elite
      team-color: aqua
      chat-color: white
      homes: 8
      coin-multiplier: 1.25
      gem-multiplier: 1.1
      daily-bonus: 100
      permissions: [mythos.chat.color]
    MYTHOS:
      weight: 100
      display: "<gradient:#c084fc:#f59e0b><bold>MYTHOS</bold></gradient>"
      prefix: "<gradient:#c084fc:#f59e0b><bold>MYTHOS</bold></gradient> <dark_gray>| "
      badge: mythos
      team-color: light_purple
      chat-color: "#f5d0fe"
      homes: 15
      coin-multiplier: 1.5
      gem-multiplier: 1.5
      daily-bonus: 250
      permissions: [mythos.chat.color]

# ───────────────────────────── Anzeige ─────────────────────────────
    VIPPLUS:
      weight: 15
      display: <green><bold>VIP</bold></green><gold><bold>+</bold></gold>
      prefix: '<green><bold>VIP</bold></green><gold><bold>+</bold></gold> <dark_gray>| '
      badge: vipplus
      team-color: green
      chat-color: white
      homes: 6
      coin-multiplier: 1.15
      gem-multiplier: 1.05
      daily-bonus: 75
      permissions: []
    HELD:
      weight: 30
      display: <gradient:#fb923c:#c2410c><bold>HELD</bold></gradient>
      prefix: '<gradient:#fb923c:#c2410c><bold>HELD</bold></gradient> <dark_gray>| '
      badge: held
      team-color: gold
      chat-color: white
      homes: 10
      coin-multiplier: 1.3
      gem-multiplier: 1.15
      daily-bonus: 150
      permissions:
      - mythos.chat.color
    LEGENDE:
      weight: 40
      display: <gradient:#fde047:#d97706><bold>LEGENDE</bold></gradient>
      prefix: '<gradient:#fde047:#d97706><bold>LEGENDE</bold></gradient> <dark_gray>| '
      badge: legende
      team-color: yellow
      chat-color: '#fef9c3'
      homes: 12
      coin-multiplier: 1.4
      gem-multiplier: 1.25
      daily-bonus: 200
      permissions:
      - mythos.chat.color
    TITAN:
      weight: 50
      display: <gradient:#818cf8:#3730a3><bold>TITAN</bold></gradient>
      prefix: '<gradient:#818cf8:#3730a3><bold>TITAN</bold></gradient> <dark_gray>| '
      badge: titan
      team-color: blue
      chat-color: '#e0e7ff'
      homes: 14
      coin-multiplier: 1.45
      gem-multiplier: 1.35
      daily-bonus: 225
      permissions:
      - mythos.chat.color
    # Content Creator (YouTube / Twitch / TikTok) – kein Team-Rang, aber gut sichtbar
