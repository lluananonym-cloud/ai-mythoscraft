# MythosCraft – Kisten (Crates)
# Platzieren: /mythos crate place <id>  (auf einen Block schauen)
# Schlüssel:  /mythos crate key <Spieler> <id> [Anzahl]  |  /mythos crate keyall <id> [Anzahl]
#
# Belohnungen (reward):
#   coins <Anzahl> | gems <Anzahl> | xp <Anzahl> | key <kiste> [Anzahl] | tool <custom-item> | item <MATERIAL> [Anzahl]
#   command <Befehl mit {player}>   (wird von der Konsole ausgeführt)
# weight = Gewichtung (Chance = weight / Summe aller weights)
# rarity = COMMON, RARE, EPIC, LEGENDARY, MYTHIC  (ab broadcast-from wird es allen angezeigt)
# model/key-model = Modell-ID im Resource Pack (Standard: crate_<id> / key_<id>)

# Nicht ändern: Damit ergänzt das Plugin nach Updates automatisch neue Einstellungen.
config-version: 18

# Hologramm über jeder Kiste
hologram:
  - "{crate}"
  - "<gray>Rechtsklick <dark_gray>»</dark_gray> <white>Öffnen"
  - "<gray>Linksklick <dark_gray>»</dark_gray> <white>Vorschau"
  - "<dark_gray>Schleichen + Rechtsklick: alle Schlüssel"

# Schleichen + Rechtsklick öffnet alle Schlüssel in der Hand ohne Animation
bulk-open: true

# Täglich wechselnde Auswahl: so viele Belohnungen zeigt jede Kiste pro Tag (0 = immer alle). Pro Kiste änderbar: rotation-size
rotation-size: 16

