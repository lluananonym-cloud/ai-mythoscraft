# MythosCraft – messages.yml
# Platzhalter stehen in {geschweiften Klammern}. Farben: &-Codes, &#RRGGBB oder MiniMessage.
# Eine Nachricht auf "" setzen, um sie abzuschalten.

# Nicht ändern: Damit ergänzt das Plugin nach Updates automatisch neue Einstellungen.
config-version: 22
config-reset:
  22: [intro]
  21: [items.minepro_totem.lore]
  20: [companion-farm.start-lore, attractions.wheel.hologram, attractions.wheel.spin-paid, attractions.wheel2.hologram]

prefix: "<gradient:#c084fc:#f59e0b><bold>MythosCraft</bold></gradient> <dark_gray>» "

general:
  usage: "<gray>Benutzung: <#e9d5ff>{usage}"
  no-permission: "<red>Dafür hast du keine Rechte."
  players-only: "<red>Dieser Befehl ist nur für Spieler."
  player-not-found: "<red>Spieler <white>{player}</white> ist nicht online."
  player-unknown: "<red>Spieler <white>{player}</white> war noch nie auf dem Server."
  not-a-number: "<red>'{value}' ist keine gültige Zahl."
  unknown-subcommand: "<red>Unbekannter Befehl. Hilfe: <white>{command}"
  error: "<red>Da ist etwas schiefgelaufen. Das Team wurde im Log informiert."
  data-loading: "<gray>Deine Daten werden noch geladen – bitte versuche es gleich nochmal."
  data-load-failed: "<red>Deine Daten konnten nicht geladen werden. Bitte verbinde dich neu."
  login-data-failed: "<red>MythosCraft konnte deine Spielerdaten nicht laden.\n<gray>Bitte versuche es in ein paar Sekunden erneut."
  save-failed: "<red>Speichern fehlgeschlagen – bitte melde das dem Team."
  reloaded: "<green>Neu geladen in {ms} ms. <gray>Config-Warnungen: <white>{warnings}"

help:
  header: "<gradient:#c084fc:#f59e0b><bold>MythosCraft</bold></gradient> <gray>v{version} – Befehle"
