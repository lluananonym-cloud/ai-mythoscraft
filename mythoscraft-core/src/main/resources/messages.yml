    status: "<dark_gray>• <#e9d5ff>/mythos status <gray>– Zustand aller Systeme"
    reload: "<dark_gray>• <#e9d5ff>/mythos reload <gray>– Config, Texte, Regionen, Events neu laden"
    bypass: "<dark_gray>• <#e9d5ff>/mythos bypass <gray>– Regionsschutz-Bypass an/aus"
    top: "<dark_gray>• <#e9d5ff>/mythos top <Statistik> <gray>– Bestenliste"
    region: "<dark_gray>• <#e9d5ff>/mythos region … <gray>– Regionen (pos1, pos2, create, set, info, …)"
    arena: "<dark_gray>• <#e9d5ff>/mythos arena … <gray>– Arenen (create, setspawn, enable, snapshot, …)"
    event: "<dark_gray>• <#e9d5ff>/mythos event … <gray>– Events (list, start, stop, info, spawnboss)"
    eco: "<dark_gray>• <#e9d5ff>/mythos eco <give|take|set> <Spieler> <coins|gems> <Betrag>"
    crate: "<dark_gray>• <#e9d5ff>/mythos crate … <gray>– Kisten (place, remove, key, keyall, list)"
    item: "<dark_gray>• <#e9d5ff>/mythos item give <Spieler> <Item|Set> [Anzahl] <gray>– Custom Items, z.B. pumpkin_set"
    boost: "<dark_gray>• <#e9d5ff>/mythos boost <coins|gems|events> <Faktor> <Dauer>"
    holo: "<dark_gray>• <#e9d5ff>/mythos holo create <Name> <Statistik> <gray>– Hologramm-Bestenliste"
    tournament: "<dark_gray>• <#e9d5ff>/mythos tournament start|test|stop|setarena|info <gray>– Turniere (test = mit Bots)"
  player-commands: "<gray>Spieler: <#e9d5ff>/spawn /home /sethome /homes /tpa /balance /pay /daily /stats /top /event /arena /tournament /shop /ah /auftrag /helpop"
  region: "<gray>/mythos region <#e9d5ff>wand | pos1 | pos2 | create <Name> [Prio] | delete <Name> | info [Name] | list | set [Region] <Flag> <true|false|none> | priority <Name> <Zahl> | redefine <Name> | flags | reload"
  arena: "<gray>/mythos arena <#e9d5ff>place <daily|weekly|monthly> [Name] | pos1 | pos2 | create <Name> | delete | info | list | setspawn | clearspawns | setspectator | enable | disable | set <Arena> <Option> <Wert> | redefine | snapshot | reset"
  crate: "<gray>/mythos crate <#e9d5ff>place <Kiste> | remove | list | types | key <Spieler> <Kiste> [Anzahl] | keyall <Kiste> [Anzahl]"

status:
  header: "<gradient:#c084fc:#f59e0b><bold>Systemstatus</bold></gradient>"
  ok: "<green>OK"
  error: "<red>FEHLER"
