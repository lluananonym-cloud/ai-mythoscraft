    - "<gray>Tasks: <white>{tasks}</white> <dark_gray>|</dark_gray> RAM: <white>{memory}</white> <dark_gray>|</dark_gray> Resource Pack: <white>{pack}"
    - "<gray>Config-Warnungen: <white>{warnings}"
  last-error: "<red>Letzter DB-Fehler: <gray>{error}"
  warning: "<gold>⚠ <gray>{warning}"

